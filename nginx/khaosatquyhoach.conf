server {
    listen 80;
    server_name khaosatquyhoach.phuongtungthien.vn;

    # Thư mục gốc chứa mã nguồn dự án
    root /var/www/khaosatquyhoach;
    index index.html;

    # Bật nén Gzip tối ưu hóa tốc độ tải trang
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 1. Phục vụ Cổng khảo sát cho người dân
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Phục vụ Trang quản trị cán bộ
    location /admin {
        try_files /admin.html =404;
    }

    # 3. Phục vụ tài liệu PDF 39.4MB và Assets
    location /documents/ {
        alias /var/www/khaosatquyhoach/documents/;
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Disposition "inline";
        add_header Access-Control-Allow-Origin "*";
        add_header Accept-Ranges "bytes";
    }

    location /assets/ {
        alias /var/www/khaosatquyhoach/assets/;
        add_header Cache-Control "public, max-age=604800";
    }

    # 4. Reverse Proxy toàn bộ API về Node.js (cổng nội bộ 3026)
    location /api/ {
        proxy_pass http://127.0.0.1:3026;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
